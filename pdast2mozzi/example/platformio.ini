; pdast2mozzi PlatformIO example
;
; Regenerate src/main.ino from patch.pd after editing the patch:
;   ./generate.sh
;
; Then build/upload as usual:
;   pio run
;   pio run -t upload
;
; PlatformIO resolves the Mozzi library dependency below automatically —
; no manual Arduino Library Manager step needed.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = sensorium/Mozzi@^2.0.0

; Uncomment for a faster/roomier board instead of the classic AVR Uno
; target (more headroom for control-rate math, no real change needed to
; the generated code — pdast2mozzi's output is board-agnostic):
;
; [env:esp32]
; platform = espressif32
; board = esp32dev
; framework = arduino
; lib_deps = sensorium/Mozzi@^2.0.0
;
; [env:teensy40]
; platform = teensy
; board = teensy40
; framework = arduino
; lib_deps = sensorium/Mozzi@^2.0.0
