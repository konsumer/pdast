[package]
name = "pdast2wclap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CLI: convert pdast JSON AST to a self-contained CLAP-wasm (WCLAP) plugin in C"
license = "Zlib"
authors = ["David Konsumer (@konsumer)"]

[dependencies]
pdast = { path = "../pdast" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
